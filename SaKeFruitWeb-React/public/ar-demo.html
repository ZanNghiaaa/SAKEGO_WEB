<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>AR Video Demo - SaKeFruit</title>
    <!-- Cập nhật A-Frame lên bản mới hơn -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
      .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: rgba(0, 0, 0, 0.85);
        color: white;
        font-family: sans-serif;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }
      #startBtn {
        margin-top: 20px;
        padding: 15px 30px;
        font-size: 20px;
        font-weight: bold;
        cursor: pointer;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 8px;
      }
      #debugUI {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 999;
        background: rgba(0,0,0,0.7);
        color: #00ff00;
        padding: 10px;
        font-family: monospace;
        font-size: 16px;
        border-radius: 5px;
        pointer-events: none;
      }
    </style>
  </head>

  <body style="margin: 0; overflow: hidden;">
    
    <!-- Giao diện hiển thị trạng thái lỗi/thành công -->
    <div id="debugUI">Trạng thái: Đang chờ...</div>

    <div id="overlay" class="overlay">
      <div class="instructions">
        <h2>Demo AR Video - SaKeFruit</h2>
        <p>1. Cấp quyền Camera.</p>
        <p>2. Mở hình ảnh <b>Hiro Marker</b> trên một thiết bị khác để quét.</p>
        <button id="startBtn">Bắt Đầu Trải Nghiệm</button>
      </div>
    </div>

    <a-scene 
      embedded 
      arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;"
      vr-mode-ui="enabled: false"
    >
      <a-assets>
        <!-- Encode tên file có dấu cách tiếng việt để không bị lỗi đường dẫn -->
        <video 
          id="ar-video" 
          preload="auto" 
          src="./assets/images/h%C6%A1p%20tra%20demo.mp4" 
          loop="true" 
          playsinline 
          webkit-playsinline
          muted
          autoplay
        ></video>
      </a-assets>

      <a-marker preset="hiro" id="marker">
        <a-video 
          src="#ar-video" 
          position="0 0.1 0" 
          rotation="-90 0 0" 
          width="4" 
          height="2.25"
        ></a-video>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const startBtn = document.getElementById('startBtn');
      const overlay = document.getElementById('overlay');
      const video = document.getElementById('ar-video');
      const marker = document.getElementById('marker');
      const debugUI = document.getElementById('debugUI');

      startBtn.addEventListener('click', function() {
        overlay.style.display = 'none';
        debugUI.innerText = "Trạng thái: Vui lòng đưa camera quét Hiro Marker";
        
        // Phát video ngay khi người dùng bấm nút (đây là User Gesture hợp lệ trên iOS)
        // Tuyệt đối không pause() lại để tránh Safari block quyền phát.
        video.play().then(() => {
          debugUI.innerText += "\n(Video đang chạy ẩn, hãy quét marker để xem)";
        }).catch(err => {
          debugUI.innerText += "\n(Lỗi load video: " + err.message + ")";
        });
      });

      marker.addEventListener('markerFound', function() {
        debugUI.innerText = "Trạng thái: ĐÃ TÌM THẤY MARKER!";
        debugUI.style.color = "#00ff00";
        // Khi tìm thấy marker, ta chỉ cần tua lại từ đầu.
        // Tránh gọi lệnh video.play() ở đây vì Safari sẽ báo "NotSupportedError" (do không có thao tác bấm)
        video.currentTime = 0;
      });

      marker.addEventListener('markerLost', function() {
        debugUI.innerText = "Trạng thái: MẤT MARKER - Hãy quét lại";
        debugUI.style.color = "yellow";
        // Không pause video, cứ để nó phát ẩn.
      });
    </script>
  </body>
</html>
